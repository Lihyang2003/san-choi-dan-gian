<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sân Chơi">
<meta name="theme-color" content="#22361a">
<link rel="apple-touch-icon" href="assets/coin.png">
<meta name="description" content="Sân Chơi Dân Gian: chơi Bầu Cua Tôm Cá và Ô Ăn Quan ngay trên trình duyệt.">
<link rel="icon" href="assets/coin.png">
<title>Sân Chơi Dân Gian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one 1280x720 landscape stage scaled to the window; positions and tokens follow the Figma file N6GJKJdEf22qrx8vXTzphf */
:root{
  --brown:#7a4220; --brown-dk:#5b3417; --brown-xdk:#4a2a12; --gold:#f2b33d; --coin:#f7ce6b;
  --cream:#fff3dc; --cream-2:#fce6c4; --cream-3:#fff8ea; --sand:#f9d9a6; --tile-line:#f5c68f; --card-line:#a8642f;
  --red:#e2533a; --title-red:#b23a26; --green:#5e9e45; --ink:#5b3417; --ink-2:#7a5a3e; --cream-sh:#c98a3e;
  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{background:#22361a;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at center,#3d5f27 0%,#1d2e15 100%)}
#app::before{content:"";position:absolute;inset:-40px;background:url(assets/bg-field.jpg) center/cover;filter:blur(22px) brightness(.55) saturate(1.1)}
#stage{position:absolute;width:1280px;height:720px;overflow:visible;--ext:0px}
/* Wide phones: the 1280x720 Figma area stays centred; scene backgrounds continue into the side margins as a mirror of their own edges */
.bg::before,.bg::after{content:"";position:absolute;top:0;bottom:0;width:var(--ext);transform:scaleX(-1);background:inherit;background-repeat:no-repeat}
.bg::before{left:calc(-1*var(--ext))}
.edgeL{translate:calc(-1*max(0px,var(--ext) - 6px)) 0}.edgeR{translate:max(0px,var(--ext) - 6px) 0}
/* Short phone screens: corner controls grow about the screen corner (--k), popups grow to fill the height (set per popup in fitModal) */
.edgeL,.edgeR{transform-origin:var(--ox,0) var(--oy,0);scale:var(--k,1)}
#toast{scale:var(--k,1);transform-origin:50% 0}
.bg::after{left:100%}
#stage.wide .oqbg{-webkit-mask-image:linear-gradient(90deg,transparent,#000 70px,#000 calc(100% - 70px),transparent);mask-image:linear-gradient(90deg,transparent,#000 70px,#000 calc(100% - 70px),transparent)}
.bg::before,.bg::after{background-size:1290px 720px}
.bg::before{background-position:-5px 0}
.bg::after{background-position:calc(var(--ext) - 1285px) 0}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
img{display:block;max-width:none;-webkit-user-drag:none}
.abs{position:absolute}
.num{font-variant-numeric:tabular-nums}
.screen{position:absolute;inset:0;animation:scrIn .5s cubic-bezier(.2,.9,.3,1) both}
.screen.out{animation:scrOut .3s ease forwards;pointer-events:none}
@keyframes scrIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes scrOut{to{opacity:0;transform:scale(.98)}}
.bg{position:absolute;inset:0;background:var(--sand) url(assets/bg-field.jpg) center/cover}
.oqbg{position:absolute;inset:0;background:var(--sand) url(assets/oq-board.jpg) no-repeat;background-size:1300px 731px;background-position:-9px -7px}

/* buttons (Figma: btn / Kind=Orange|Brown|Cream|Disabled) */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:58px;padding:0 28px;border-radius:29px;box-sizing:border-box;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;transition:transform .08s,box-shadow .08s,filter .15s}
.btn.orange{color:var(--cream);background:linear-gradient(#f06b4a,#d9452e);border:3px solid var(--gold);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 5px 0 #9c2f1e,0 10px 16px rgba(0,0,0,.18)}
.btn.brown{color:var(--cream);background:var(--brown);border:2px solid var(--brown-xdk);box-shadow:0 4px 0 var(--brown-xdk),0 8px 12px rgba(0,0,0,.15)}
.btn.cream{color:var(--ink);background:linear-gradient(#ffe9c2,#f7cf94);border:2px solid var(--gold);box-shadow:0 4px 0 var(--cream-sh)}
.btn.off,.btn[disabled]{color:var(--cream);background:rgba(205,184,154,.9);border:0;box-shadow:none;cursor:default}
.btn:not([disabled]):active{transform:translateY(3px)}
.btn.orange:not([disabled]):active{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 2px 0 #9c2f1e}
.btn.brown:not([disabled]):active{box-shadow:0 1px 0 var(--brown-xdk)}
.btn.cream:not([disabled]):active{box-shadow:0 1px 0 var(--cream-sh)}
.btn.sm{height:44px;font-size:18px;padding:0 20px;letter-spacing:1px}
.play{position:relative;display:inline-block;padding:14px}
.play::before{content:"";position:absolute;left:10px;right:10px;top:12px;bottom:12px;border-radius:32px;background:var(--coin);filter:blur(6px);opacity:.75;animation:glow 1.4s ease-in-out infinite}
.play .btn{animation:breathe 1.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.25;transform:scale(1.06)}}
@keyframes breathe{50%{transform:scale(1.04)}}
.ibtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--brown);box-shadow:inset 0 0 0 2.5px var(--gold),0 4px 0 var(--brown-xdk),0 8px 12px rgba(0,0,0,.18);transition:transform .08s}
.ibtn:active{transform:translateY(3px)}
.ibtn svg{width:24px;height:24px}
svg.i{fill:none;stroke:var(--cream);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* wood sign (Figma: wood-sign) */
.sign{display:inline-flex;padding:10px 12px;border-radius:20px;background:linear-gradient(#b9773d,#8a4d22);box-shadow:inset 0 0 0 3px var(--brown-dk),0 5px 0 var(--brown-xdk),0 10px 16px rgba(0,0,0,.2)}
.sign b{display:block;padding:6px 26px;border-radius:12px;background:linear-gradient(#fce3b6,#f3c27f);box-shadow:inset 0 2px 3px rgba(122,66,32,.35);font-family:var(--display);font-weight:800;font-size:34px;line-height:36px;color:var(--title-red);text-transform:uppercase;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px}
.coin{width:20px;height:20px;border-radius:50%;background:url(assets/coin.png) center/cover no-repeat;flex:none}

/* panels */
.dark{background:var(--brown-dk);border-radius:30px;box-shadow:inset 0 0 0 6px var(--gold);color:var(--cream)}
.card{background:var(--cream);border-radius:24px;box-shadow:inset 0 0 0 3px var(--gold),0 5px 0 var(--cream-sh)}
.chipst{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;color:var(--cream);background:rgba(252,230,196,.2);white-space:nowrap}
.chipst.g{background:var(--green)}.chipst.r{background:var(--red)}
.pchip{display:flex;align-items:center;gap:8px;min-width:0}
.pchip img{width:44px;height:44px;border-radius:50%;outline:2px solid var(--cream);outline-offset:-2px;flex:none;object-fit:cover}
.pchip .n{font-family:var(--display);font-weight:700;font-size:14px;line-height:15px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.pchip .c{display:flex;align-items:center;gap:4px;font-weight:700;font-size:12px;color:var(--coin)}
.pchip .c .coin{width:16px;height:16px}

/* modal (Figma: wood frame + cream body + sign) */
.modal{position:absolute;top:0;bottom:0;left:calc(-1*var(--ext));right:calc(-1*var(--ext));z-index:50;display:grid;place-items:center;background:rgba(42,26,12,.6);animation:fade .22s ease both}
.modal.out{animation:fadeOut .2s ease forwards}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.frame{position:relative;padding:36px 20px 20px;border-radius:30px;background:#a8642f url(assets/wood.png) center/cover;box-shadow:inset 0 0 0 4px var(--brown-dk),0 8px 0 var(--brown-xdk),0 20px 40px rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.modal.out .frame{animation:popOut .2s ease forwards}
@keyframes pop{from{transform:scale(.6) translateY(40px);opacity:0}}
@keyframes popOut{to{transform:scale(.88);opacity:0}}
.frame>.body{background:rgba(255,248,234,.96);border-radius:22px;box-shadow:inset 0 0 0 2px var(--tile-line);padding:46px 24px 22px;box-sizing:border-box}
.frame>.sign{position:absolute;left:50%;top:-31px;transform:translateX(-50%)}
.frame>.x{position:absolute;right:-14px;top:-14px}
.mtitle{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;text-align:center;text-transform:uppercase}
.p{font-weight:600;font-size:15px;color:var(--ink-2);line-height:1.45;margin:0}

#toast{position:absolute;left:50%;top:92px;z-index:90;opacity:0;transform:translate(-50%,-20px);transition:transform .3s cubic-bezier(.3,1.4,.5,1),opacity .2s;padding:8px 20px;border-radius:999px;background:var(--green);color:var(--cream);font-family:var(--display);font-weight:800;font-size:20px;box-shadow:inset 0 0 0 2px var(--cream),0 6px 14px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.dk{background:var(--brown-dk)}

/* splash */
.kid{position:absolute;filter:drop-shadow(0 12px 8px rgba(60,30,0,.25))}
.kid img{width:100%;height:100%;object-fit:contain;transform:scale(1.32);transform-origin:50% 62%}
.bobA{animation:bobA 1.8s ease-in-out infinite}
.bobB{animation:bobA 2.1s ease-in-out .3s infinite}
@keyframes bobA{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-16px) rotate(1.5deg)}}
.sway{animation:sway 2.6s ease-in-out infinite;transform-origin:50% 0}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.spark{position:absolute;width:40px;height:40px;animation:twinkle 1.8s ease-in-out infinite}
.spark::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#fff7c2 0,#ffd75e 25%,transparent 60%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.lbar{width:460px;height:24px;border-radius:12px;background:var(--brown-dk);box-shadow:inset 0 0 0 2px var(--gold);padding:4px;box-sizing:border-box}
.lbar i{display:block;height:100%;width:4%;border-radius:8px;background:linear-gradient(#ffc56b,#f06b4a);transition:width .25s}

/* home cards */
.gcard{position:absolute;top:120px;width:480px;height:440px;border-radius:34px;background:linear-gradient(var(--cream),#f7d49a);box-shadow:inset 0 0 0 8px var(--card-line),0 8px 0 var(--brown),0 16px 26px rgba(0,0,0,.22);text-align:center;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.gcard:hover{transform:translateY(-6px)}
.gcard .art{position:absolute;left:18px;top:26px;width:444px;height:210px;border-radius:22px;overflow:hidden}
.gcard h2{position:absolute;left:0;right:0;top:248px;margin:0;font-family:var(--display);font-weight:800;font-size:34px;line-height:36px;color:var(--ink);text-transform:uppercase}
.gcard .p{position:absolute;left:0;right:0;top:296px}
.gcard .play{position:absolute;left:116px;top:329px}
.mtile{position:absolute;width:87px;height:79px;border-radius:16px;background:var(--cream-2);box-shadow:inset 0 0 0 3.7px var(--tile-line),0 3px 0 rgba(122,66,32,.35);display:grid;place-items:center}
.mtile img{width:54px;height:54px;object-fit:contain}

/* tiles (Figma: bc-tile) */
.tile{position:absolute;width:140px;height:128px;border-radius:26px;background:var(--cream-2);box-shadow:inset 0 0 0 6px var(--tile-line),0 5px 0 rgba(122,66,32,.35);transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .2s,opacity .3s}
.tile .art{position:absolute;left:26px;top:20px;width:88px;height:88px;object-fit:contain;transition:transform .2s}
.tile:hover .art{transform:scale(1.06) rotate(-3deg)}
.tile .tick,.tile .lock,.tile .tag{display:none}
.tile .tick{position:absolute;right:6px;top:8px;width:30px;height:30px}
.tile .lock{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--brown);box-shadow:inset 0 0 0 1.5px var(--gold);place-items:center}
.tile .lock svg{width:14px;height:14px}
.tile .tag{position:absolute;left:50%;top:-12px;transform:translateX(-50%);padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;color:var(--cream);white-space:nowrap}
.tile .bets{position:absolute;left:8px;bottom:8px;display:flex}
.tile .bets img{width:32px;height:32px;border-radius:50%;object-fit:cover;outline:2px solid #fff8ea;outline-offset:-2px;box-shadow:0 2px 4px rgba(0,0,0,.25);margin-right:-8px;animation:pop .4s cubic-bezier(.3,1.5,.5,1) both}
.tile.sel{box-shadow:inset 0 0 0 6px var(--green),0 0 16px rgba(94,158,69,.45),0 5px 0 rgba(122,66,32,.35);transform:translateY(-3px)}
.tile.sel .tick,.tile.win .tick{display:block}
.tile.locked{box-shadow:inset 0 0 0 6px var(--green),0 0 16px rgba(94,158,69,.45),0 5px 0 rgba(122,66,32,.35)}
.tile.locked .tick{display:block}.tile.locked .lock{display:grid}
.tile.dim{opacity:.5}
.tile.result{box-shadow:inset 0 0 0 6px var(--gold),0 0 22px rgba(242,179,61,.9);animation:resPulse 1s ease-in-out infinite alternate;z-index:2}
.tile.result .tag{display:block;background:var(--gold)}
@keyframes resPulse{to{transform:scale(1.05)}}
.tile.win{box-shadow:inset 0 0 0 6px var(--green),0 5px 0 rgba(122,66,32,.35)}
.tile.win .tag{display:block;background:var(--green)}
.tile.lose{opacity:.6}.tile.lose .tag{display:block;background:var(--red)}
.tile.result.win{box-shadow:inset 0 0 0 6px var(--green),0 0 22px rgba(94,158,69,.8)}

/* bowl & die */
.bowl{position:absolute;left:514px;top:420px;width:220px;height:150px;transform-origin:50% 80%}
.bowl>img{width:220px;height:150px;object-fit:contain}
.die{position:absolute;left:79px;top:34px;width:62px;height:62px}
.die img{width:62px;height:62px;object-fit:contain}
.face{width:52px;height:52px;margin:5px;border-radius:12px;background:linear-gradient(145deg,#fffdf6,#efdcb8);box-shadow:inset -3px -4px 0 rgba(190,150,90,.4),inset 2px 2px 0 #fff,0 3px 4px rgba(40,20,0,.35);display:grid;place-items:center;transform:rotate(-8deg)}
.face img{width:38px;height:38px}
.bowl.shake{animation:bshake .28s ease-in-out infinite}
@keyframes bshake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-10px,-6px) rotate(-6deg)}50%{transform:translate(8px,-10px) rotate(5deg)}75%{transform:translate(-6px,-3px) rotate(-3deg)}}
.motion{position:absolute;top:448px;width:40px;height:90px;border:5px solid transparent;border-radius:50%;opacity:0;pointer-events:none}
.motion.l{left:472px;border-left-color:var(--red)}.motion.r{left:736px;border-right-color:var(--red)}
.motion.l2{left:458px;top:458px;height:70px;border-left-color:var(--red)}.motion.r2{left:756px;top:458px;height:70px;border-right-color:var(--red)}
.shaking .motion{animation:mline .28s ease-in-out infinite alternate}
@keyframes mline{from{opacity:.2}to{opacity:.95}}
.die.pop{animation:diePop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes diePop{0%{transform:scale(.4) rotate(-160deg)}100%{transform:none}}
.hint{position:absolute;padding:4px 16px;border-radius:999px;background:rgba(91,52,23,.75);color:var(--cream);font-weight:800;font-size:15px;white-space:nowrap;transform:translateX(-50%)}

/* chat (Figma: Chat panel) */
.chat{position:absolute;display:flex;flex-direction:column;padding:20px 22px 16px;box-sizing:border-box}
.chat h3{margin:0;font-family:var(--display);font-weight:800;font-size:24px;line-height:26px;color:var(--cream-2);text-align:center}
.chat .div{height:2px;background:rgba(252,230,196,.35);margin:12px 0}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msg{display:flex;gap:8px;align-items:flex-start;animation:pop .35s cubic-bezier(.3,1.5,.5,1) both}
.msg img{width:44px;height:44px;border-radius:50%;outline:2px solid var(--cream);outline-offset:-2px;margin-top:7px;flex:none;object-fit:cover}
.msg .who{font-size:12px;font-weight:700;color:var(--cream-2)}
.msg .bub{display:inline-block;margin-top:2px;padding:6px 12px;border-radius:14px;background:var(--cream-2);color:var(--ink);font-weight:700;font-size:15px;max-width:180px;word-wrap:break-word}
.msg .t{font-size:12px;color:rgba(252,230,196,.6);align-self:flex-end;margin-left:4px}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:var(--gold)}
.msg.me .who{text-align:right}
.msg.sys{justify-content:center}.msg.sys .bub{background:rgba(252,230,196,.15);color:var(--cream-2);font-size:13px}
.chatin{display:flex;gap:8px}
.chatin input{flex:1;min-width:0;height:44px;border-radius:999px;border:0;padding:0 18px;background:rgba(252,230,196,.12);box-shadow:inset 0 0 0 1.5px rgba(252,230,196,.4);color:var(--cream);font:700 15px var(--body)}
.chatin input::placeholder{color:rgba(252,230,196,.7)}
.chatin button{width:44px;height:44px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
.chatin button svg{width:20px;height:20px}

/* o an quan */
.cell{position:absolute;border-radius:10px;transition:background .2s,box-shadow .2s}
.cell.can{cursor:pointer;background:rgba(255,248,220,.22);box-shadow:inset 0 0 0 2px rgba(242,179,61,.55)}
.cell.can:hover{background:rgba(255,248,220,.42)}
.cell.sel{background:rgba(255,236,170,.55);box-shadow:inset 0 0 0 4px var(--gold)}
.cell.flash{animation:cflash .55s ease}
@keyframes cflash{40%{background:rgba(255,205,80,.75);box-shadow:inset 0 0 0 4px var(--red)}}
.cell.drop{animation:cdrop .22s ease}
@keyframes cdrop{50%{background:rgba(255,255,255,.35)}}
.peb{position:absolute;width:24px;height:21px;background-size:contain;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 2px 1px rgba(60,30,0,.35))}
.peb.t0{background-image:url(assets/peb-pink.png)}.peb.t1{background-image:url(assets/peb-dark.png)}.peb.t2{background-image:url(assets/peb-white.png)}.peb.t3{background-image:url(assets/peb-peach.png)}
.qstone{position:absolute;width:96px;height:62px;background:url(assets/quan.png) center/contain no-repeat;filter:drop-shadow(0 4px 3px rgba(60,30,0,.35))}
.cnt{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;background:var(--brown);color:var(--cream);font-weight:700;font-size:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cnt.z{opacity:.4}
.qpts{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);padding:1px 8px;border-radius:999px;background:var(--gold);box-shadow:inset 0 0 0 1.5px var(--brown-dk);font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.arrow{position:absolute;top:50%;margin-top:-24px;width:48px;height:48px;border-radius:50%;background:linear-gradient(#f06b4a,#d9452e);box-shadow:inset 0 0 0 2.5px var(--gold),0 4px 0 #9c2f1e,0 6px 10px rgba(0,0,0,.3);display:grid;place-items:center;z-index:6;animation:pop .3s cubic-bezier(.3,1.6,.5,1) both}
.arrow svg{width:24px;height:24px}
.arrow.l{left:-26px}.arrow.r{right:-26px}
.hand{position:absolute;left:0;top:0;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a8,var(--gold));box-shadow:0 0 0 3px var(--cream),0 8px 14px rgba(0,0,0,.35);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);z-index:20;transition:transform .17s ease,opacity .2s;opacity:0;pointer-events:none}
.hand.on{opacity:1}

<body>
<div id="app"><div id="stage"><div id="toast" role="status"></div></div></div>
<div id="rotate"><div><div class="ph"></div><div style="font-family:var(--display);font-weight:800;font-size:28px">Xoay ngang điện thoại</div><p style="font-weight:700;margin:8px 0 18px">Trò chơi được thiết kế cho màn hình ngang.</p><button class="btn orange sm" id="rotateSkip">Vẫn chơi dọc</button></div></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const stage=$('#stage');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const today=()=>new Date().toLocaleDateString('sv');
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.toLocaleDateString('sv')};
const hhmm=(ts=Date.now())=>new Date(ts).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
const when=ts=>{const d=new Date(ts),t=new Date();const same=d.toDateString()===t.toDateString();const y=new Date();y.setDate(y.getDate()-1);return (same?'Hôm nay':d.toDateString()===y.toDateString()?'Hôm qua':d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'}))+' '+hhmm(ts)};
const sgn=n=>n>0?'+'+n:n<0?'−'+Math.abs(n):'0';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
/* icons exported from the Figma icon row (2:140) */
const P={
 back:'<path d="M12 19L5 12L12 5"/><path d="M19 12H5"/>',
 help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
 settings:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
 sound:'<path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A2 2 0 0 1 5 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2a2 2 0 0 1 1.4.4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.36 18.36a9 9 0 0 0 0-12.73"/>',
 mute:'<path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A2 2 0 0 1 5 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2a2 2 0 0 1 1.4.4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/>',
 close:'<path d="M18 6L6 18"/><path d="M6 6l12 12"/>',
 send:'<path d="M14.54 21.69a.5.5 0 0 0 .94-.02l6.5-19a.5.5 0 0 0-.64-.63l-19 6.5a.5.5 0 0 0-.02.93l7.93 3.18a2 2 0 0 1 1.11 1.11z"/><path d="M21.85 2.15L10.91 13.09"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 userplus:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/>',
 lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 copy:'<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
 left:'<path d="M15 18l-6-6 6-6"/>', right:'<path d="M9 18l6-6-6-6"/>', play:'<path d="M6 3l14 9-14 9V3z"/>', clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'
};
const I=k=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const edge=x=>x<100?' edgeL':x>=1080?' edgeR':'';
const eo=(x,y)=>x<100?`--ox:${-x}px;--oy:${-y}px;`:x>=1080?`--ox:${1280-x}px;--oy:${-y}px;`:'';
const ibtn=(id,k,label,x,y)=>`<button class="ibtn abs${edge(x)}" id="${id}" aria-label="${label}" style="${eo(x,y)}left:${x}px;top:${y}px">${I(k)}</button>`;
const sign=(t,x,y,extra='')=>`<div class="sign abs ${extra}" style="left:${x}px;top:${y}px"><b>${t}</b></div>`;

/* ---------- saved progress (this browser only) ---------- */
const KEY='sanchoi-dangian-v2';
const DEF=()=>({name:'Tuấn Anh',pid:String(100000+rnd(899999)),joined:new Date().toLocaleDateString('vi-VN',{month:'2-digit',year:'numeric'}),balance:12,xp:0,sound:true,music:false,vibrate:false,stake:1,
  tx:[{ts:Date.now(),amt:12,label:'Quà chào mừng bạn mới'}],
  stats:{bc:{rounds:0,wins:0,won:0},oq:{games:0,wins:0,draws:0,losses:0,quans:0}},
  checkin:{last:null,streak:0},daily:{day:today(),video:0,invite:false}});
let S;
try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(KEY)||'null')||{})}catch(e){S=DEF()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function daily(){if(!S.daily||S.daily.day!==today())S.daily={day:today(),video:0,invite:false};return S.daily}
function addLixi(amt,label){S.balance+=amt;S.tx.unshift({ts:Date.now(),amt,label});S.tx=S.tx.slice(0,50);save();$$('[data-bal]').forEach(e=>e.textContent=S.balance)}
/* levels: level n needs 100*n points to reach n+1 */
function lvInfo(){let lv=1,x=S.xp;while(x>=lv*100){x-=lv*100;lv++}return {lv,cur:x,need:lv*100}}
function addXp(n){S.xp+=n;save()}
const STAKES=[{v:1,lv:1},{v:2,lv:4},{v:5,lv:6}];

/* ---------- sound: synthesised, starts after the first tap ---------- */
let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,type='sine',v=.12,at=0){if(!S.sound)return;const a=ac();if(!a)return;try{const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SFX={click:()=>tone(560,.07,'triangle',.09),tick:()=>tone(820+rnd(260),.05,'sine',.08),pick:()=>{tone(300,.09,'triangle',.1);tone(420,.08,'triangle',.07,.05)},
 cap:()=>[660,880,1100].forEach((f,i)=>tone(f,.14,'triangle',.1,i*.07)),coin:()=>{tone(988,.1,'square',.05);tone(1319,.3,'square',.05,.08)},
 win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.12,i*.12)),lose:()=>[392,330,262].forEach((f,i)=>tone(f,.3,'sine',.12,i*.18)),
 shake:()=>{for(let i=0;i<22;i++)tone(150+rnd(140),.05,'square',.03,i*.08)}};
/* background music: a soft pentatonic loop */
let musicT=null;const MEL=[523,587,659,784,880,784,659,587,523,440,523,587];
function musicTick(i=0){if(!S.music)return;const a=ac();if(!a)return;try{const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=MEL[i%MEL.length]/2;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.55)}catch(e){}musicT=setTimeout(()=>musicTick(i+1),420)}
function setMusic(on){clearTimeout(musicT);if(on)musicTick()}
function buzz(){if(S.vibrate&&navigator.vibrate)try{navigator.vibrate([60,40,120])}catch(e){}}
let firstTap=true;
document.addEventListener('pointerdown',e=>{if(firstTap){firstTap=false;ac();if(S.music)setMusic(true)}if(e.target.closest('button'))SFX.click()},true);

/* ---------- scale stage to window ---------- */
let rotateSkipped=false;
const FIT={s:1,ext:0,k:1};
/* grow a popup toward ~0.8 of real size on short screens, limited by the space it has */
function fitModal(m){const f=$('.frame',m);if(!f)return;const w=f.offsetWidth,hgt=f.offsetHeight+44;const want=Math.max(1,Math.min(0.8/FIT.s,2.2));const km=Math.max(1,Math.min(want,680/hgt,(1280+2*FIT.ext-40)/w));f.style.scale=km.toFixed(3)}
/* iOS Safari reports a stale innerWidth right after rotation, so measure the #app box itself and re-fit a few times */
const appEl=$('#app');
function fit(){const r=appEl.getBoundingClientRect(),cs=getComputedStyle(appEl),pl=parseFloat(cs.paddingLeft)||0,pr=parseFloat(cs.paddingRight)||0,pt=parseFloat(cs.paddingTop)||0,pb=parseFloat(cs.paddingBottom)||0;
  const W=r.width||innerWidth,H=r.height||innerHeight,w=Math.max(1,W-pl-pr),hh=Math.max(1,H-pt-pb),s=Math.min(w/1280,hh/720);
  stage.style.left=(pl+(w-1280*s)/2)+'px';stage.style.top=(pt+(hh-720*s)/2)+'px';stage.style.transformOrigin='0 0';stage.style.transform=`scale(${s})`;const ext=Math.max(0,Math.ceil((w/s-1280)/2));stage.style.setProperty('--ext',(ext?ext+2:0)+'px');stage.classList.toggle('wide',ext>8);
  /* target ~32pt corner buttons; never grow past what the side margin can hold */
  FIT.s=s;FIT.ext=ext;FIT.k=Math.max(1,Math.min(0.62/s,1.6,1+ext/240));stage.style.setProperty('--k',FIT.k.toFixed(3));$$('.modal',stage).forEach(fitModal);
  $('#rotate').classList.toggle('need',!rotateSkipped&&H>W&&W<700)}
function refit(){fit();requestAnimationFrame(fit);[120,300,600,1000].forEach(t=>setTimeout(fit,t))}
$('#rotateSkip').onclick=()=>{rotateSkipped=true;fit()};
addEventListener('resize',refit);addEventListener('orientationchange',refit);addEventListener('pageshow',refit);
if(window.visualViewport)visualViewport.addEventListener('resize',refit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(appEl);
fit();
let toastT;function toast(msg,dark,ms=2400){const t=$('#toast');t.innerHTML=msg;t.classList.toggle('dk',!!dark);t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}
/* iPhone Safari keeps its bars in landscape; a home-screen launch gives ~1.5x more height. Tell the player once. */
function homeScreenTip(){try{const ios=/iPhone|iPod/.test(navigator.userAgent);if(!ios||navigator.standalone||FIT.s>0.45||localStorage.getItem('sanchoi-tip'))return;localStorage.setItem('sanchoi-tip','1');setTimeout(()=>toast('Mẹo: bấm Chia sẻ → Thêm vào MH chính để chơi toàn màn hình',1,6000),900)}catch(e){}}

/* ---------- screen + modal manager ---------- */
let cur=null,timers=[];
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}
function go(el){timers.forEach(clearTimeout);timers=[];const old=cur;cur=el;stage.insertBefore(el,$('#toast'));if(old){old.classList.add('out');setTimeout(()=>old.remove(),320)}closeAll()}
function modal(title,w,body,{onClose,closable=true}={}){
  const m=h(`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="frame" style="width:${w}px"><div class="body"></div><div class="sign"><b>${title}</b></div></div></div>`);
  const b=$('.body',m);if(typeof body==='string')b.innerHTML=body;else b.appendChild(body);
  const close=()=>{if(m.classList.contains('out'))return;m.classList.add('out');setTimeout(()=>m.remove(),220);onClose&&onClose()};
  m.close=close;
  if(closable){const x=h(`<button class="ibtn x" aria-label="Đóng">${I('close')}</button>`);x.onclick=close;$('.frame',m).appendChild(x);m.addEventListener('pointerdown',e=>{if(e.target===m)close()})}

/* =====================================================
   Ô ĂN QUAN
   ô 0 = quan trái, 1–5 = hàng của Mai (trái → phải), 6 = quan phải,
   7–11 = hàng của bạn (phải → trái). dir +1 = theo chiều kim đồng hồ.
   ===================================================== */
const RECT={0:[124,246,170,240],1:[318,239,125,113],2:[453,239,129,113],3:[592,239,129,113],4:[731,239,126,113],5:[867,239,123,113],6:[1006,246,170,240],
  11:[307,365,126,131],10:[444,365,138,131],9:[592,365,133,131],8:[736,365,128,131],7:[876,365,130,131]};
const isQ=i=>i===0||i===6, cval=c=>c.p+(c.q?10:0), OWN=[[7,8,9,10,11],[1,2,3,4,5]];
function oqInit(){const b=[];for(let i=0;i<12;i++)b.push(isQ(i)?{p:0,q:true}:{p:5,q:false});return {b,score:[0,0],quan:[0,0]}}
function oqClone(s){return {b:s.b.map(c=>({p:c.p,q:c.q})),score:s.score.slice(),quan:s.quan.slice()}}
function oqPlay(s,pl,pos,dir,ev){
  const b=s.b,step=i=>(i+dir+12)%12;
  let hand=b[pos].p;b[pos].p=0;ev&&ev.push({t:'pick',pos,n:hand});let i=pos,guard=0;
  for(;;){if(++guard>300)break;
    while(hand>0){i=step(i);b[i].p++;hand--;ev&&ev.push({t:'drop',pos:i,left:hand})}
    const nx=step(i);
    if(isQ(nx)){ev&&ev.push({t:'stop',pos:nx,why:'quan'});break}
    if(b[nx].p>0){hand=b[nx].p;b[nx].p=0;i=nx;ev&&ev.push({t:'pick',pos:nx,n:hand});continue}
    let e=nx,ate=false;
    for(;;){const tg=step(e),v=cval(b[tg]);
      if(v===0){if(!ate)ev&&ev.push({t:'stop',pos:tg,why:'empty2'});break}
      s.score[pl]+=v;if(b[tg].q)s.quan[pl]++;ev&&ev.push({t:'cap',pos:tg,n:b[tg].p,q:b[tg].q,pl,v});b[tg].p=0;b[tg].q=false;ate=true;
      const e2=step(tg);if(cval(s.b[e2])!==0)break;e=e2}
    break}
}
const oqMoves=(s,pl)=>{const m=[];OWN[pl].forEach(p=>{if(s.b[p].p>0){m.push([p,1]);m.push([p,-1])}});return m};
const oqOver=s=>cval(s.b[0])===0&&cval(s.b[6])===0;
function oqAI(s,pl,diff){
  const mv=oqMoves(s,pl);if(!mv.length)return null;
  if(diff==='easy'&&Math.random()<.75)return pick(mv);
  const sc=mv.map(m=>{const c=oqClone(s);oqPlay(c,pl,m[0],m[1]);let g=c.score[pl]-s.score[pl];
    if(diff==='hard'){const op=1-pl,om=oqMoves(c,op);let best=om.length?-99:-5;om.forEach(o=>{const c2=oqClone(c);oqPlay(c2,op,o[0],o[1]);best=Math.max(best,c2.score[op]-c.score[op])});g-=best*.9}
    return {m,g:g+Math.random()*.3}});
  sc.sort((a,b)=>b.g-a.g);return sc[0].m;
}

const P5=[[22,31],[51,21],[79,31],[36,58],[66,58]];
function pebHTML(pos,n){
  const [, , w,hh]=RECT[pos];let s='';const q=isQ(pos);const show=Math.min(n,q?14:15);
  for(let k=0;k<show;k++){let x,y;
    if(!q&&n<=5){x=P5[k][0]*(w/125);y=P5[k][1]+(hh-113)/2}
    else{const cols=q?4:4,col=k%cols,row=Math.floor(k/cols);const jx=Math.sin(pos*31+k*7.3)*3,jy=Math.cos(pos*17+k*3.1)*3;
      if(q){x=w/2-52+col*26+jx;y=row<2?20+row*24+jy:hh-70+(row-2)*22+jy}else{x=12+col*25+(row%2)*10+jx;y=14+row*22+jy}}
    s+=`<i class="peb t${(k+pos)%4}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px"></i>`}
  return s}

function oqRenderAll(){for(let i=0;i<12;i++)oqRenderCell(i);oqScores()}
function oqScores(){$('#v0').textContent=G.D.score[0];$('#v1').textContent=G.D.score[1]}
const oqHuman=()=>G.mode==='pvp'||G.turn===0;
const oqName=p=>G.names[p];
function oqTurnUI(){
  const s0=$('#s0'),s1=$('#s1');if(!s0)return;const ai=G.mode==='ai';
  $('#g0').style.opacity=G.turn===0?1:0;$('#g1').style.opacity=G.turn===1?1:0;
  if(G.turn===0){s0.textContent=G.busy?'Đang rải quân':(ai?'Lượt của bạn':'Đến lượt');s0.className='st go';s1.textContent='Đang chờ';s1.className='st'}
  else{s1.textContent=G.busy?'Đang rải quân':(ai?'Đang nghĩ...':'Đến lượt');s1.className='st go';s0.textContent=ai?'Chờ Mai':'Đang chờ';s0.className='st'}
  const hint=$('#oqh');
  if(!G.busy&&oqHuman())hint.textContent=G.sel!=null?'Chọn hướng rải: mũi tên trái hoặc phải':(ai?'Chạm 1 ô ở hàng dưới (hàng của bạn) để bốc quân':`${oqName(G.turn)}: chạm 1 ô ở hàng ${G.turn===0?'dưới':'trên'} để bốc quân`);
  else hint.textContent=G.busy?`${oqName(G.turn)} đang rải quân...`:'Mai đang nghĩ nước đi...';
  $$('.cell').forEach(c=>{const i=+c.dataset.i;const can=!G.busy&&oqHuman()&&OWN[G.turn].includes(i)&&G.s.b[i].p>0;c.classList.toggle('can',can)});
}
function oqTap(i,e){
  if(G.busy||!oqHuman()||!OWN[G.turn].includes(i)||e.target.closest('.arrow'))return;
  if(G.s.b[i].p===0){toast('Ô này hết quân, chọn ô khác',1);return}
  $$('.arrow').forEach(a=>a.remove());$$('.cell.sel').forEach(c=>c.classList.remove('sel'));
  if(G.sel===i){G.sel=null;oqTurnUI();return}
  G.sel=i;const c=$(`.cell[data-i="${i}"]`);c.classList.add('sel');
  const top=OWN[1].includes(i),dl=top?-1:1,dr=top?1:-1;
  const L=h(`<button class="arrow l" aria-label="Rải sang trái">${I('left')}</button>`),R=h(`<button class="arrow r" aria-label="Rải sang phải">${I('right')}</button>`);
  L.onclick=ev=>{ev.stopPropagation();oqDo(i,dl)};R.onclick=ev=>{ev.stopPropagation();oqDo(i,dr)};c.appendChild(L);c.appendChild(R);oqTurnUI();
}
const cc=i=>{const [x,y,w,hh]=RECT[i];return [x+w/2,y+hh/2]};
function handTo(i,n){const hd=$('#hand');if(!hd)return;const [x,y]=cc(i);hd.style.transform=`translate(${x}px,${y-24}px)`;hd.textContent=n;hd.classList.add('on')}
function flyTo(pos,pl,n){const [x,y]=cc(pos);const t=pl===0?[328,600]:[971,130];
  for(let k=0;k<n;k++){const f=h(`<i class="fly" style="left:${x-11+rnd(30)-15}px;top:${y-9+rnd(30)-15}px"></i>`);stage.appendChild(f);
    setTimeout(()=>{f.style.transform=`translate(${t[0]-x}px,${t[1]-y}px) scale(.6)`;f.style.opacity='.2'},30+k*35);setTimeout(()=>f.remove(),800+k*35)}}
async function oqDo(pos,dir){
  if(G.busy)return;const g=G;g.busy=true;g.sel=null;$$('.arrow').forEach(a=>a.remove());$$('.cell.sel').forEach(c=>c.classList.remove('sel'));
  const pl=g.turn,ev=[];oqTurnUI();oqPlay(g.s,pl,pos,dir,ev);g.moves++;
  const sp=180;
  for(const e of ev){if(G!==g||!$('#hand'))return;const c=$(`.cell[data-i="${e.pos}"]`);
    if(e.t==='pick'){g.D.b[e.pos].p=0;oqRenderCell(e.pos);handTo(e.pos,e.n);SFX.pick();await wait(sp+220)}
    else if(e.t==='drop'){g.D.b[e.pos].p++;oqRenderCell(e.pos);handTo(e.pos,e.left);c.classList.remove('drop');void c.offsetWidth;c.classList.add('drop');SFX.tick();await wait(sp)}
    else if(e.t==='stop'){$('#hand').classList.remove('on');await wait(sp+140)}
    else if(e.t==='cap'){$('#hand').classList.remove('on');c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');SFX.cap();flyTo(e.pos,e.pl,Math.min(e.n+(e.q?3:0),10));await wait(380);
      g.D.b[e.pos].p=0;g.D.b[e.pos].q=false;g.D.score[e.pl]+=e.v;if(e.q)g.D.quan[e.pl]++;oqRenderCell(e.pos);oqScores();
      if(e.q){toast(`${oqName(e.pl)} ăn được quan! +10 điểm`);if(e.pl===0&&g.mode==='ai'){S.stats.oq.quans++;save()}}
      await wait(sp+260)}}
  $('#hand').classList.remove('on');
  if(oqOver(g.s)||g.moves>=160){await oqEnd();return}
  g.turn=1-pl;const nr=OWN[g.turn];
  if(nr.every(p=>g.s.b[p].p===0)){g.s.score[g.turn]-=5;nr.forEach(p=>g.s.b[p].p=1);
    $('#oqh').textContent=`Hàng của ${g.turn===0&&g.mode==='ai'?'bạn':oqName(g.turn)} hết quân · lấy 5 điểm rải lại 5 ô`;toast(`${oqName(g.turn)} rải lại 5 quân`,1);
    for(const p of nr){g.D.b[p].p=1;oqRenderCell(p);SFX.tick();await wait(180)}await wait(500)}
  g.D=oqClone(g.s);oqRenderAll();g.busy=false;oqTurnUI();
  if(g.mode==='ai'&&g.turn===1){await wait(850);if(G!==g||!$('#hand'))return;const m=oqAI(g.s,1,g.diff);if(m){const c=$(`.cell[data-i="${m[0]}"]`);c.classList.add('sel');await wait(450);c.classList.remove('sel');oqDo(m[0],m[1])}}
}
async function oqEnd(){
  const g=G,s=g.s;let rem=0;
  $('#oqh').textContent='Hết quan, thu quân! Mỗi bên lấy dân còn trên hàng mình.';
  OWN.forEach((row,pl)=>row.forEach(p=>{rem+=s.b[p].p;s.score[pl]+=s.b[p].p;s.b[p].p=0}));
  if(rem)for(const pl of [0,1])for(const p of OWN[pl])if(g.D.b[p].p){flyTo(p,pl,Math.min(g.D.b[p].p,6));g.D.b[p].p=0;oqRenderCell(p);await wait(130)}
  g.D=oqClone(s);oqScores();await wait(900);if(G!==g)return;
  const [a,b]=s.score,res=a>b?'win':a<b?'lose':'draw';let reward=0;
  if(g.mode==='ai'){S.stats.oq.games++;addXp(res==='win'?50:30);
    if(res==='win'){S.stats.oq.wins++;reward=3;addLixi(4,`Ô Ăn Quan · thắng Mai (${DIFF[g.diff]})`)}
    else if(res==='draw'){S.stats.oq.draws++;addLixi(1,'Ô Ăn Quan · hòa, hoàn vé')}else S.stats.oq.losses++;save()}
  if(res==='win'||(g.mode==='pvp'&&res!=='draw')){SFX.win();confetti();buzz()}else if(res==='lose')SFX.lose();else SFX.coin();
  const head=g.mode==='pvp'?(res==='draw'?'Hòa nhau rồi!':`${res==='win'?g.names[0]:g.names[1]} thắng rồi!`):({win:'Bạn thắng rồi!',lose:'Mai thắng rồi!',draw:'Hòa nhau rồi!'})[res];
  const col=res==='lose'&&g.mode==='ai'?'var(--red)':res==='draw'?'var(--ink)':'var(--green)';
  const line=g.mode==='pvp'?'Ván chơi 2 người không tính lì xì':({win:`<b class="pos" style="font-size:22px">+${reward} lì xì</b> · số dư ${S.balance} · +50 điểm cấp`,lose:`Mất vé vào trận 1 lì xì · +30 điểm cấp`,draw:`Hoàn vé 1 lì xì · số dư ${S.balance} · +30 điểm cấp`})[res];
  const card=(img,nm,sc,hl)=>`<div style="width:160px;height:190px;border-radius:20px;background:var(--cream-2);box-shadow:inset 0 0 0 ${hl?'4px var(--gold)':'3px var(--tile-line)'}${hl?',0 0 18px rgba(242,179,61,.7)':''};display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;box-sizing:border-box"><div style="width:140px;height:128px;background:url(${img}) 50% 20%/210% auto no-repeat"></div><div style="font-weight:800;font-size:13px;color:var(--ink-2)">${nm}</div><div style="font-family:var(--display);font-weight:800;font-size:24px;color:var(--title-red)">${sc} điểm</div></div>`;
  const body=h(`<div style="text-align:center"><div class="mtitle" style="color:${col};font-size:44px">${head}</div>
    <div style="display:flex;justify-content:center;align-items:center;gap:34px;margin-top:16px">${card(KIDB,g.names[0],a,res==='win')}<span style="font-family:var(--display);font-weight:800;font-size:34px;color:var(--red)">VS</span>${card(KIDG,g.names[1],b,res==='lose')}</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink-2)">${g.mode==='ai'?'<i class="coin" style="width:28px;height:28px"></i>':''}${line}</div>
    <div style="display:flex;justify-content:center;gap:14px;margin-top:18px"><button class="btn brown" id="h" style="width:200px">Về trang chủ</button><button class="btn cream" id="m" style="width:200px">Đổi chế độ</button><button class="btn orange" id="r" style="width:180px">Đấu lại</button></div></div>`);
  const m=modal('Kết quả',700,body,{closable:false});
  $('#h',body).onclick=()=>{m.close();home()};$('#m',body).onclick=()=>{m.close();oqMenu()};
  $('#r',body).onclick=()=>{m.close();if(g.mode==='ai'){if(S.balance<1){bcOut();return}addLixi(-1,'Ô Ăn Quan · vé vào trận')}oqStart(g.mode,g.diff)};
}
function oqLeave(){
  const ai=G.mode==='ai';
  const b=h(`<div style="text-align:center"><div style="font-family:var(--display);font-weight:800;font-size:26px">Ván đang chơi sẽ bị hủy</div><p class="p">${ai?'Vé vào trận 1 lì xì không được hoàn lại và ván này tính là thua.':'Kết quả ván 2 người sẽ không được lưu.'}</p>
    <div style="display:flex;justify-content:center;gap:16px;margin-top:16px"><button class="btn cream" id="s" style="width:200px">Chơi tiếp</button><button class="btn orange" id="l" style="width:200px">Rời ván</button></div></div>`);
  const m=modal('Rời ván?',540,b);$('#s',b).onclick=()=>m.close();
  $('#l',b).onclick=()=>{if(ai){S.stats.oq.games++;S.stats.oq.losses++;save()}G=null;m.close();oqMenu()};
}

/* boot */
splash();
</script>
</body>
</html>
